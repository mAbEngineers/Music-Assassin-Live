<text x="36" y="340.0" font-size="13" font-weight="700" fill="#212529">What changed</text>
<text x="36" y="360.0" font-size="12" fill="#343a40">Dry is the live input block; wet is one mono signal copied to both channels.</text>
<text x="36" y="378.0" font-size="12" fill="#343a40">If wet is not ready the callback plays dry for the missing samples.</text>
<text x="36" y="396.0" font-size="12" fill="#343a40">Models: gtcrn, dpdfnet, speechdenoiser. Every model sees a mono downmix.</text>
