<text x="36" y="480.0" font-size="13" font-weight="700" fill="#212529">What changed</text>
<text x="36" y="500.0" font-size="12" fill="#343a40">Fixed: FIFO caps follow the processor's declared latency, and a trim on either side</text>
<text x="36" y="518.0" font-size="12" fill="#343a40">drops the matching samples on the other. Chunked separators were 84 % unprocessed.</text>
<text x="36" y="536.0" font-size="12" fill="#343a40">New: mask shaper (suppression floor, release smoothing) after every model; off by default.</text>
<text x="36" y="554.0" font-size="12" fill="#343a40">New: StemgenRT, a causal separator, 5.8 ms. Stereo rebuild clamp 8 to 1 is uncommitted.</text>
